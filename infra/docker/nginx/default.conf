# HMR de Next.js en developpement : `Connection` doit valoir `upgrade`
# uniquement quand le client demande un WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /srv/api/public;
    index index.php;

    client_max_body_size 10m;

    # En-tetes communs aux pages Next.js et a l'API (sans X-Robots-Tag :
    # Next.js emet lui-meme le noindex sur ses propres reponses).
    include /etc/nginx/snippets/security-headers.conf;

    # Toute l'API passe par le front controller Slim.
    location /api {
        include /etc/nginx/snippets/api-headers.conf;
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include /etc/nginx/snippets/api-headers.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass api:9000;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    # Site public et administration servis par Next.js.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
