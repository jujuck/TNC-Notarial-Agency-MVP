[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Compose injecte les variables d'environnement au conteneur.
clear_env = no

; Sonde de sante PHP-FPM pour une verification manuelle via un client FastCGI.
ping.path = /ping
ping.response = pong

access.log = /proc/self/fd/2
catch_workers_output = yes
