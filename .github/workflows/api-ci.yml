name: API CI

on:
  push:
    paths:
      - "api/**"
      - "infra/docker/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - "compose.prod.yaml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "infra/docker/**"
      - "compose.yaml"
      - "compose.override.yaml"
      - "compose.prod.yaml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Qualite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Composer audit
        run: composer audit

  docker:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image API
        run: docker build -f infra/docker/api/Dockerfile -t tnc-api:ci .

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "$PWD/infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
